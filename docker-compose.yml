services:
  hiddn_website:
    image: on9au/hiddn-website:latest
    # build: .
    restart: always
    env_file: .env
    network_mode: host
    depends_on:
      - mysql
    volumes:
      - /var/lib/hiddn_website:/var/lib/hiddn_website

  mysql:
    image: mysql:latest
    restart: always
    env_file: .env
    network_mode: host
    command: --bind-address=127.0.0.1 --mysqlx-bind-address=127.0.0.1 --disable-log-bin
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - /var/lib/hiddn_website/mysql:/var/lib/mysql
