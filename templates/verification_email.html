<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Verification</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        color: #333;
        background-color: #f4f4f4;
        margin: 0;
        padding: 0;
      }
      .email-container {
        background-color: #ffffff;
        margin: 50px auto;
        padding: 30px;
        max-width: 600px;
        border-radius: 8px;
      }
      .header {
        text-align: center;
        font-size: 24px;
        color: #ec9114;
      }
      .content {
        margin: 20px 0;
      }
      .code {
        font-size: 32px;
        font-weight: bold;
        color: #ec9114;
        text-align: center;
      }
      .footer {
        text-align: center;
        font-size: 12px;
        color: #aaa;
        margin-top: 30px;
      }
    </style>
  </head>
  <body>
    <div class="email-container">
      <div class="header">HiddN VPN Email Verification</div>
      <div class="content">
        <p>Hi there,</p>
        <p>To complete your registration, please use the following verification code:</p>
        <p class="code">{{ code }}</p>
        <p>This code will expire in 10 minutes.</p>
      </div>
      <div class="footer">If you didn't request this email, please ignore it.</div>
    </div>
  </body>
</html>
