[package]
name = "hiddn-website"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7.9", features = ["macros"] }
axum-login = "0.16.0"
chrono = { version = "0.4.38", features = ["serde"] }
futures = "0.3.31"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
tokio = { version = "1.42.0", features = ["full"] }
typeshare = "1.0.4"
uuid = { version = "1.11.0", features = ["serde", "v4"] }
argon2 = { version = "0.5.3", features = ["simple", "password-hash"] }
dotenvy = "0.15.7"
rand = "0.8.5"
tracing-subscriber = "0.3.19"
tracing = "0.1.41"
tower-http = { version = "0.6.2", features = ["fs", "trace"] }
reqwest = { version = "0.12.9", features = ["json"] }
envy = "0.4.2"
once_cell = "1.20.2"
axum-server = { version = "0.7.1", features = ["tls-rustls"] }
sqlx = { version = "0.8.2", features = ["chrono", "macros", "mysql", "runtime-tokio", "uuid", "bigdecimal"] }
marzban_api = "0.2.8"
zxcvbn = "3.1.0"
num-traits = "0.2.19"
clap = { version = "4.5.23", features = ["derive"] }
async-stripe = { version = "0.39.1", features = ["runtime-tokio-hyper-rustls"] }

[[bin]]
name = "hiddn-website"
path = "src/main.rs"

[[bin]]
name = "hiddn-cli"
path = "src/cli.rs"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
