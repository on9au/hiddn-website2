[package]
name = "hiddn-website"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7.9"
axum-login = "0.16.0"
chrono = "0.4.38"
futures = "0.3.31"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
tokio = { version = "1.41.1", features = ["full"] }
typeshare = "1.0.4"
uuid = { version = "1.11.0", features = ["serde", "v4"] }
# sqlx = { version = "0.8.2", features = ["mysql", "runtime-tokio-native-tls", "macros", "uuid", "chrono"] }
argon2 = "0.5.3"
dotenvy = "0.15.7"
rand = "0.8.5"
tracing-subscriber = "0.3.19"
tracing = "0.1.41"
tower-http = { version = "0.6.2", features = ["fs"] }
reqwest = { version = "0.12.9", features = ["json"] }
# async-stripe = { version = "0.39.1", features = ["runtime-tokio-hyper"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
