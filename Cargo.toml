[package]
name = "hiddn-website"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7.7"
axum-login = "0.16.0"
chrono = "0.4.38"
futures = "0.3.31"
serde = { version = "1.0.213", features = ["derive"] }
serde_json = "1.0.132"
tokio = { version = "1.41.0", features = ["full"] }
typeshare = "1.0.4"
uuid = { version = "1.3.0", features = ["serde", "v4"] }
sqlx = { version = "0.8.2", features = ["mysql", "runtime-tokio-native-tls", "macros", "uuid", "chrono"] }
argon2 = "0.5.3"
dotenvy = "0.15.7"
rand = "0.8.5"
tracing-subscriber = "0.3.18"
tracing = "0.1.40"
async-stripe = { version = "0.39.1", features = ["runtime-tokio-hyper"] }
