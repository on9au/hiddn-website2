[package]
name = "hiddn-website"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.4", features = ["macros"] }
axum-login = "0.17.0"
chrono = { version = "0.4.41", features = ["serde"] }
futures = "0.3.31"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.45.0", features = ["full"] }
uuid = { version = "1.16.0", features = ["serde", "v4"] }
argon2 = { version = "0.5.3", features = ["simple", "password-hash"] }
dotenvy = "0.15.7"
rand = "0.9.1"
tracing-subscriber = "0.3.19"
tracing = "0.1.41"
tower-http = { version = "0.6.2", features = ["fs", "trace"] }
reqwest = { version = "0.12.9", features = ["json", "stream"] }
envy = "0.4.2"
once_cell = "1.20.2"
axum-server = { version = "0.7.2", features = ["tls-rustls"] }
sqlx = { version = "0.8.5", features = [
    "chrono",
    "macros",
    "mysql",
    "runtime-tokio",
    "uuid",
    "bigdecimal",
] }
marzban_api = "0.2.8"
zxcvbn = "3.1.0"
num-traits = "0.2.19"
clap = { version = "4.5.23", features = ["derive"] }
async-stripe = { version = "0.39.1", features = ["runtime-tokio-hyper-rustls"] }
rpassword = "7.3.1"
lettre = "0.11.15"
tera = "1.20.0"
anyhow = "1.0.98"
ts-rs ={ version = "10.1", features = ["chrono-impl"] }
async-trait = "0.1.88"

[[bin]]
name = "hiddn-website"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
